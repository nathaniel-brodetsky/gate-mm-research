[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mmlab"
version = "0.0.0"
description = "Quantitative market making research on Gate"
requires-python = ">=3.11"
dependencies = ["numpy==2.5.5", "polars==2.1.0", "websockets==17.4"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6", "mypy==2.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mmlab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
